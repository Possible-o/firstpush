<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Sign Up</h2>
    <form class="form" id="signup">
        <input type="text" placeholder="Enter your full name" id="fullname">
        <input type="email" placeholder="Enter your email" id="email">
        <input type="password" placeholder="Set a password" id="password">
        <input type="password" placeholder="Confirm your password" id="confirmPassword">
        <button type="submit">Submit</button>
        <p id="error"></p>
    </form>
    <p id="alreadyHaveAccount">Already have an account? <a href="login.html">Login</a></p>
    <main>
        <script src="main.js"></script>
    </main>
</body>
</html>
